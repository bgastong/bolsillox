<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="bolsillox: registrá tus ingresos y gastos y mirá tus finanzas personales." />
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark light" />
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo). Ver src/lib/theme.js -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("bolsillox.theme");
          if (saved === "light" || saved === "dark" || saved === "system") theme = saved;
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bolsillox" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>bolsillox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
