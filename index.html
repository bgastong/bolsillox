<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Registrá ingresos y gastos en segundos y llegá a fin de mes sabiendo cuánto te queda. Gratis, en pesos y en dólares." />
    <!-- Vista previa al compartir el link (WhatsApp, redes, Slack...). Las URLs
         tienen que ser absolutas: si cambia el dominio, cambiarlas aca. -->
    <link rel="canonical" href="https://bolsillox.com.ar/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bolsillox" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://bolsillox.com.ar/" />
    <meta property="og:title" content="bolsillox · Tu plata, clara." />
    <meta property="og:description" content="Registrá ingresos y gastos en segundos y llegá a fin de mes sabiendo cuánto te queda. Gratis, en pesos y en dólares." />
    <meta property="og:image" content="https://bolsillox.com.ar/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="bolsillox: tu saldo, ingresos y gastos del mes de un vistazo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="bolsillox · Tu plata, clara." />
    <meta name="twitter:description" content="Registrá ingresos y gastos en segundos y llegá a fin de mes sabiendo cuánto te queda." />
    <meta name="twitter:image" content="https://bolsillox.com.ar/og.png" />
    <meta name="theme-color" content="#08090a" />
    <meta name="color-scheme" content="dark light" />
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo). Ver src/lib/theme.js -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("bolsillox.theme");
          if (saved === "light" || saved === "dark" || saved === "system") theme = saved;
        } catch (e) {}
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        // Paleta de colores elegida (Ajustes > Colores). Ver src/lib/appearance.js
        try {
          var appearance = JSON.parse(localStorage.getItem("bolsillox.appearance") || "null");
          if (appearance && /^(suave|sobria|contraste)$/.test(appearance.palette)) root.dataset.palette = appearance.palette;
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bolsillox" />
    <!-- Las tipografias (solo la parte latina) se piden ya, sin esperar a la hoja
         de estilos: el texto aparece antes y sin saltos. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>bolsillox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
