name: CI

# Corre en cada PR y en cada push a master.
on:
  pull_request:
  push:
    branches: [master]

# Si llega un push nuevo al mismo PR, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests y build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 22 es la minima soportada (node:sqlite); 24 es la que se usa en desarrollo.
        node: [22, 24]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests de la API
        run: npm test

      - name: Build
        run: npm run build
